name: Stage sequenziali

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  scrivi-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Scrivi file
        run: |
          echo "Ciao, sono il primo job!" > file.txt
          echo "File scritto con successo!"ù
        
      - name: Upload artefatto
        uses: actions/upload-artifact@v4
        with:
          name: generated-file
          path: file.txt

